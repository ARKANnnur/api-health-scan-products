[project]
name = "nutri-backend"
version = "1.0.0"
description = "NUTRI-101 Backend - FastAPI modular project"
authors = [
    {name = "heavenly demon", email = "darkannur@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.0,<0.120.0)",
    "uvicorn[standard] (>=0.32.0,<0.40.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<3.0.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "structlog (>=24.4.0,<26.0.0)",
    "httpx (>=0.28.0,<0.30.0)",
    "pyjwt[crypto] (>=2.8.0,<3.0.0)",
    "cryptography (>=42.0.0,<51.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.3.0,<9.0.0)",
    "pytest-asyncio (>=0.25.0,<2.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)",
    "ruff (>=0.8.0,<1.0.0)",
    "black (>=24.10.0,<26.0.0)",
    "mypy (>=1.13.0,<2.0.0)",
    "isort (>=5.13.0,<7.0.0)",
    "pre-commit (>=4.0.0,<5.0.0)",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=app/features",
    "--cov=app/core",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N818", "UP046"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"app/db/migrations/*" = ["W291", "SIM103"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"